<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>癌醫伴你同行｜R7 腳本檢核</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f2eb;color:#233a33;font:16px/1.65 system-ui}main{max-width:1500px;margin:auto;padding:clamp(14px,3vw,40px)}h1,h2{line-height:1.25}.bar,nav{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.bar{background:#f4f2eb;position:sticky;top:0;padding:10px 0;z-index:2}article{background:white;padding:18px;margin:15px 0;border:1px solid #cfdbd3;border-radius:8px;scroll-margin-top:85px}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}img{width:100%;display:block}textarea,input,select,button{font:inherit}textarea{width:100%;padding:8px;min-height:65px}input[type=text]{width:8em}.check{display:block;color:#275b47;margin:6px 0}.line{margin-bottom:10px}.line select{max-width:100%}small{color:#4e625a}a{color:#215d48}button{cursor:pointer}h3{margin:0 0 8px}@media(max-width:750px){.grid{grid-template-columns:1fr}.bar{position:static}}</style>
<main><h1>癌醫伴你同行｜R7 腳本檢核</h1><p id="intro"></p><nav><a href="癌醫伴你同行-R7全片腳本檢核稿.md" download>下載原始腳本</a><a href="production.zip" download>本次影片生成提示詞與剪接順序</a> <a href="downloads/R7-production-prompts.zip" download>下載生圖與影片標準提示詞原檔</a> <a href="final.mp4?v=minimax">播放 MiniMax 原聲版</a> <a href="r7-transitions.html">六鏡轉場與動作修訂</a><button id="export" disabled>匯出目前腳本與檢核紀錄</button></nav><p><small>S45 的「六年後」從出生起算。醫療對白與院方署名待確認。修改與勾選會儲存在此瀏覽器。</small></p><div class="bar"><select id="filter" aria-label="篩選"><option>全部</option><option>尚待檢核</option><option>有旁白</option><option>有審片意見</option></select><select id="jump" aria-label="跳至鏡頭"></select><strong id="progress"></strong><span id="status" role="status"></span></div><div id="rows"></div></main>
<script type="module">
const $=id=>document.getElementById(id),el=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;return n};
const key='hope-r7-script-review-v1',labels=['影格','描述與生圖提示詞','角色與聲音'];let data,edits;
function state(r){const s=edits[r.id]??={description:r.description,voice:structuredClone(r.voice),checks:[false,false,false],note:''};if(s.imagePrompt===undefined){s.imagePrompt=r.imagePrompt;s.checks[1]=false}return s}
function save(){try{localStorage.setItem(key,JSON.stringify(edits));$('status').textContent='已儲存'}catch{$('status').textContent='儲存失敗，請匯出備份'}count()}
function count(){$('progress').textContent=data.shots.filter(r=>state(r).checks.every(Boolean)).length+'／'+data.shots.length+' 鏡通過'}
function input(tag,value,label,change){const n=el(tag);n.value=value;n.setAttribute('aria-label',label);n.oninput=()=>change(n.value);return n}
function filtered(r){const f=$('filter').value,s=state(r);return f==='全部'||(f==='尚待檢核'&&!s.checks.every(Boolean))||(f==='有旁白'&&s.voice.some(l=>l.mode==='旁白'))||(f==='有審片意見'&&r.notes.length)}
function render(){const shots=data.shots.filter(filtered);$('jump').replaceChildren(new Option('跳至鏡頭',''),...shots.map(r=>new Option(r.id,r.id)));$('rows').replaceChildren(...shots.map(card));count()}
function card(r){const s=state(r),row=el('article'),g=el('div');row.id=r.id;g.className='grid';row.append(el('h2',r.id),g);
const cols=['關鍵影格','畫面與轉場描述','角色對白與旁白'].map((title,i)=>{const col=el('section'),l=el('label'),c=el('input');l.className='check';c.type='checkbox';c.checked=s.checks[i];c.onchange=()=>{s.checks[i]=c.checked;save();if(!filtered(r))render()};l.append(c,' '+labels[i]+'已確認');col.append(el('h3',title),l);g.append(col);return col});
const a=el('a'),im=el('img');a.href=r.image;a.target='_blank';im.src=r.image;im.loading='lazy';im.alt=r.id+' R7 關鍵影格';a.append(im);cols[0].append(a);
cols[1].append(input('textarea',s.description,'畫面描述',v=>{s.description=v;s.checks[1]=false;cols[1].querySelector('input').checked=false;save()}));
cols[1].append(el('h3','正式生圖提示詞（搭配左欄參考圖）'),input('textarea',s.imagePrompt,r.id+' 生圖提示詞',v=>{s.imagePrompt=v;s.checks[1]=false;cols[1].querySelector('input').checked=false;save()}));
const record=el('details'),original=el('pre',r.productionRecord);
original.style.whiteSpace='pre-wrap';original.style.overflowWrap='anywhere';record.append(el('summary','查看生圖與影片製作提示詞原文'),original);cols[1].append(record);
const voice=cols[2],box=el('div');voice.append(box);
function dirty(){s.checks[2]=false;voice.querySelector('input').checked=false;save()}
function lines(){box.replaceChildren();if(!s.voice.length)box.append(el('p','無台詞'));s.voice.forEach((l,i)=>{const div=el('div');div.className='line';const who=input('input',l.role,'說話角色',v=>{l.role=v;dirty()});who.type='text';const mode=el('select');mode.setAttribute('aria-label','聲音類型');for(const m of ['現場對白','畫外對白','旁白'])mode.add(new Option(m,m,false,m===l.mode));mode.onchange=()=>{l.mode=mode.value;dirty()};const del=el('button','移除');del.onclick=()=>{if(confirm('移除這句台詞？')){s.voice.splice(i,1);dirty();lines()}};div.append(who,mode,del,input('textarea',l.text,'台詞',v=>{l.text=v;dirty()}));box.append(div)})}
lines();const add=el('button','新增台詞');add.onclick=()=>{s.voice.push({role:'',mode:'現場對白',text:''});dirty();lines()};voice.append(add);
if(r.notes.length){const d=el('details');d.append(el('summary','原片審閱意見（'+r.notes.length+'）'));for(const n of r.notes)d.append(el('p',n.time+'　'+n.text));row.append(d)}
row.append(el('label','檢核備註'),input('textarea',s.note,'檢核備註',v=>{s.note=v;save()}));return row}
try{const res=await fetch('r7-script.json');if(!res.ok)throw Error(res.status);data=await res.json();edits=JSON.parse(localStorage.getItem(key)||'{}');$('intro').textContent=data.intro;render();$('filter').onchange=render;$('jump').onchange=()=>$( $('jump').value)?.scrollIntoView();$('export').disabled=false;
$('export').onclick=()=>{const out=['# 癌醫伴你同行｜R7 腳本檢核紀錄','',data.intro,''];for(const r of data.shots){const s=state(r);out.push('## '+r.id,'',s.description,'','正式生圖提示詞',s.imagePrompt,'',r.productionRecord,'','關鍵影格：'+new URL(r.image,location.href).href,'',...(s.voice.length?s.voice.map(l=>l.role+'（'+l.mode+'）：「'+l.text+'」'):['無台詞。']),'',...labels.map((l,i)=>'- ['+(s.checks[i]?'x':' ')+'] '+l),'','檢核備註：'+s.note,'')}const a=el('a'),url=URL.createObjectURL(new Blob([out.join('\n')],{type:'text/markdown;charset=utf-8'}));a.href=url;a.download='癌醫伴你同行-R7腳本檢核紀錄.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
}catch(e){$('status').textContent='載入失敗：'+e.message}
</script></html>
