<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>希望之島｜全片生成進度</title><style>body{margin:auto;max-width:1100px;padding:28px;background:#f4f1e9;color:#263d3b;font:17px/1.7 system-ui}a{color:#176b68}h1{font-size:30px}article,.status{background:white;padding:20px;border-radius:14px;margin:16px 0}progress,video{width:100%}video{max-height:580px;background:#111}img{width:240px;max-width:100%;border-radius:8px}button{padding:9px 16px;cursor:pointer}small{color:#62736f}.row{display:flex;gap:22px;align-items:center;flex-wrap:wrap}pre{white-space:pre-wrap;font:14px/1.6 monospace}#final{display:none}</style><a href="index.html">← 返回審片網頁</a><h1>希望之島｜修正版影音生成</h1><p>720p・對話、環境音與配樂。GB10 逐段生成及保存，最後整合為一支影片。</p><div class="status"><strong id="status">讀取進度中…</strong><p id="detail"></p><progress id="bar" max="65" value="0"></progress><small id="updated"></small><p>「待審片」表示檔案、影格與音軌已通過技術檢查；人物、台詞、動作與轉場仍須團隊確認。字幕為依腳本估算的時間，尚未逐字對齊。</p></div><section id="final"><h2>整合版候選影片</h2><video id="master" controls playsinline></video><a href="media/revision-r2/dialogue-estimated.srt" download>下載台詞字幕（估算時間）</a></section><div id="shots"></div><script src="vendor/hls.min.js"></script><script>
const labels={running:'生成中',waiting_for_revised_reference:'等待新版參考素材',waiting_for_queue_or_cooling:'等待資源或降溫',assembling:'整合全片中',complete_awaiting_review:'全片生成完成，待審片',stopped:'排程已停止，保留已完成片段'};let rendered=new Set(),master=false;
const el=(tag,text)=>{let e=document.createElement(tag);if(text)e.textContent=text;return e};
async function refresh(){try{let p=await(await fetch('data/revision-r2.json?t='+Date.now())).json();document.getElementById('status').textContent=(labels[p.phase]||p.phase)+' · '+p.ready+' / '+p.total;let j=p.jobs.find(x=>x.id===p.current);document.getElementById('detail').textContent=p.error|| (j?j.title+'｜本段最高溫 '+(j.maxTemperature??'—')+'°C':'');document.getElementById('bar').max=p.total;document.getElementById('bar').value=p.ready;document.getElementById('updated').textContent='資料更新：'+new Date(p.updatedAt*1000).toLocaleString('zh-TW')+(Date.now()/1000-p.updatedAt>120?'（同步暫停或延遲；GB10 排程獨立執行）':'');
for(let j of p.jobs){if(!j.available||rendered.has(j.id))continue;rendered.add(j.id);let card=el('article'),row=el('div');row.className='row';let img=el('img');img.src='media/revision-r2/'+j.id+'/review.jpg';img.alt=j.title;row.append(img);let info=el('div');info.append(el('h2',j.title),el('p',(j.audioOnly?'結尾旁白素材':'影片片段')+' · 待審片'));let button=el('button','播放此段');info.append(button);row.append(info);card.append(row);button.onclick=()=>{let video=el('video');video.controls=true;video.playsInline=true;video.src='media/revision-r2/'+j.id+'/review_720p.mp4';card.append(video);button.remove();video.play().catch(()=>{});};if(j.kind==='h3'){let d=el('details'),s=el('summary','台詞與標準提示詞');d.append(s);d.addEventListener('toggle',async()=>{if(d.dataset.loaded)return;d.dataset.loaded='1';let x=await(await fetch('media/revision-r2/'+j.id+'/job.json')).json();d.append(el('p',(x.dialogue||[]).join(' ')||'本段無對白'),el('pre',x.prompt));});card.append(d);}document.getElementById('shots').append(card);}
if(p.phase==='complete_awaiting_review'&&!master){master=true;document.getElementById('final').style.display='block';let v=document.getElementById('master'),url='media/revision-r2/film/index.m3u8';if(v.canPlayType('application/vnd.apple.mpegurl'))v.src=url;else if(Hls.isSupported()){let h=new Hls();h.loadSource(url);h.attachMedia(v);}let t=el('track');t.kind='subtitles';t.label='繁體中文（估算時間）';t.srclang='zh-TW';t.src='media/revision-r2/dialogue-estimated.vtt';v.append(t);}
}catch(e){document.getElementById('status').textContent='暫時無法讀取同步資料，稍後自動重試。';}}
refresh();setInterval(refresh,25000);
</script></html>
