name: Sync team feedback to Issues
on:
  schedule:
    # UTC 01:00–10:00 = Asia/Taipei 09:00–18:00, Monday–Friday.
    - cron: '0 1-10 * * 1-5'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: feedback-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-feedback.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_SYNC_SECRET: ${{ secrets.REVIEW_SYNC_SECRET }}
          REVIEW_API: https://ntucc-movie-feedback.netlify.app/api/comments
